<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc33;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="15" fill="#0a0e17"/>
  
  <!-- Terminal window -->
  <rect x="12" y="18" width="76" height="64" rx="8" fill="#0f1724" stroke="#00ff41" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Title bar dots -->
  <circle cx="22" cy="26" r="4" fill="#ff5f56"/>
  <circle cx="36" cy="26" r="4" fill="#ffbd2e"/>
  <circle cx="50" cy="26" r="4" fill="#27c93f"/>
  
  <!-- Matrix rain characters -->
  <g font-family="monospace" font-size="10" fill="url(#matrixGrad)" font-weight="bold">
    <text x="20" y="42">ア</text>
    <text x="32" y="42">イ</text>
    <text x="44" y="42">ウ</text>
    <text x="56" y="42">エ</text>
    <text x="68" y="42">オ</text>
    
    <text x="20" y="54">0</text>
    <text x="32" y="54">1</text>
    <text x="44" y="54">0</text>
    <text x="56" y="54">1</text>
    <text x="68" y="54">0</text>
    
    <text x="26" y="66">{</text>
    <text x="38" y="66">root</text>
    <text x="64" y="66">}</text>
  </g>
  
  <!-- Blinking cursor -->
  <rect x="26" y="74" width="8" height="12" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>